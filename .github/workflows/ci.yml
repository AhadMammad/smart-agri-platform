name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.5.11"

jobs:
  # ---------------------------------------------------------------------------
  quality:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: etl
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: etl/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff (lint)
        run: uv run ruff check --output-format=github .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Unit tests with coverage gate
        run: uv run pytest -m "not integration" --cov --cov-report=xml --cov-report=term

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: etl/coverage.xml

  # ---------------------------------------------------------------------------
  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck scripts/*.sh docker/superset/bootstrap.sh

  # ---------------------------------------------------------------------------
  compose:
    name: Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate .env
        run: make env

      - name: Validate every profile resolves
        run: make validate-compose

  # ---------------------------------------------------------------------------
  assets:
    name: Superset and Liquibase assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Superset YAML parses, and chart params are valid JSON
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          import json, pathlib, sys, yaml

          root = pathlib.Path("superset/assets")
          failures = []
          for path in sorted(root.rglob("*.yaml")):
              try:
                  doc = yaml.safe_load(path.read_text())
                  # A chart's `params` is a JSON document embedded in a YAML
                  # string; a syntax error there only surfaces at import time.
                  if path.parent.name == "charts":
                      json.loads(doc["params"])
              except Exception as exc:  # noqa: BLE001
                  failures.append(f"{path}: {exc}")

          for failure in failures:
              print(f"::error::{failure}")
          sys.exit(1 if failures else 0)
          PY

      - name: Liquibase changelogs are well-formed XML
        run: |
          python - <<'PY'
          import pathlib, sys, xml.etree.ElementTree as ET

          failures = []
          for path in sorted(pathlib.Path("liquibase").rglob("*.xml")):
              try:
                  ET.parse(path)
              except ET.ParseError as exc:
                  failures.append(f"{path}: {exc}")

          for failure in failures:
              print(f"::error::{failure}")
          sys.exit(1 if failures else 0)
          PY

  # ---------------------------------------------------------------------------
  # The full stack is too heavy for a hosted runner (HDFS + Hive + Airflow +
  # Superset). This job proves the ETL image builds and its CLI runs; the
  # integration suite is exercised on the VM via `make test-integration`.
  image:
    name: Build ETL image
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/etl/Dockerfile
          target: runtime
          tags: smart-agri-etl:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the CLI
        run: |
          docker run --rm smart-agri-etl:ci version
          docker run --rm smart-agri-etl:ci --help

      - name: Doctor fails cleanly when nothing is reachable
        run: |
          # An unreachable stack must exit non-zero rather than hang or crash,
          # because that exit code is what fails the Airflow task.
          if docker run --rm smart-agri-etl:ci doctor --timeout 2; then
            echo "::error::doctor exited 0 with no services running"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  dags:
    name: DAG integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the Airflow image
        run: docker build -t smart-agri-airflow:ci docker/airflow

      - name: Run DAG integrity tests
        run: |
          # `bash -c` is required: the Airflow image's entrypoint forwards its
          # arguments to the `airflow` CLI, so a bare `pytest` is parsed as an
          # airflow subcommand and rejected.
          docker run --rm \
            -e AIRFLOW__CORE__LOAD_EXAMPLES=false \
            -e AIRFLOW__CORE__DAGS_FOLDER=/opt/airflow/dags \
            -v "${PWD}/airflow/dags:/opt/airflow/dags:ro" \
            -v "${PWD}/airflow/tests:/opt/airflow/tests:ro" \
            smart-agri-airflow:ci \
            bash -c "pytest /opt/airflow/tests -q"
