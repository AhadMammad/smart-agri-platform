# Rainfall against measured soil moisture, per field per day.
#
# A ClickHouse view rather than a Superset virtual dataset: the join and the
# `is_actual` filter belong in one place, so every chart asks the same question
# the same way. See clickhouse/ddl/views/035_weather_views.sql.
table_name: v_field_water_daily
main_dttm_col: observation_date
description: Weather and soil measurements joined per field per day, actuals only
default_endpoint: null
offset: 0
cache_timeout: null
catalog: null
schema: null
sql: null
params: null
