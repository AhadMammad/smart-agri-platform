metrics:
  - metric_name: count
    verbose_name: Rows
    metric_type: count
    expression: COUNT(*)
    description: null
    d3format: null
    currency: null
    extra: null
    warning_text: null
  - metric_name: total_rainfall
    verbose_name: Rainfall (mm)
    metric_type: sum
    expression: SUM(precipitation_mm)
    description: Total precipitation over the selected period
    d3format: ',.1f'
    currency: null
    extra: null
    warning_text: null
  - metric_name: avg_moisture
    verbose_name: Avg soil moisture (%)
    metric_type: avg
    expression: AVG(avg_soil_moisture_pct)
    description: null
    d3format: ',.1f'
    currency: null
    extra: null
    warning_text: null
  - metric_name: total_et0
    verbose_name: Evapotranspiration (mm)
    metric_type: sum
    expression: SUM(et0_mm)
    description: Reference crop water demand
    d3format: ',.1f'
    currency: null
    extra: null
    warning_text: null
  - metric_name: net_water_balance
    verbose_name: Water balance (mm)
    metric_type: sum
    expression: SUM(water_balance_mm)
    description: Rainfall less evapotranspiration; negative means a deficit
    d3format: '+,.1f'
    currency: null
    extra: null
    warning_text: null
  - metric_name: dry_days
    verbose_name: Dry days
    metric_type: sum
    expression: "SUM(CASE WHEN aridity_flag = 'dry' THEN 1 ELSE 0 END)"
    description: Days where evaporation exceeded rainfall by more than 3 mm
    d3format: ',d'
    currency: null
    extra: null
    warning_text: null
  - metric_name: peak_gdd
    verbose_name: Accumulated degree-days
    metric_type: max
    expression: MAX(gdd_cumulative)
    description: Growing-degree days accumulated, base 10 °C
    d3format: ',.0f'
    currency: null
    extra: null
    warning_text: null
