# What each machine did, burned and cost, per day.
#
# Telemetry is the spine, so a parked machine still produces a row and the
# fleet's idle time is visible rather than absent.
table_name: agg_machine_daily
main_dttm_col: activity_date
description: Daily fleet activity, fuel, faults and utilisation per machine
default_endpoint: null
offset: 0
cache_timeout: null
catalog: null
schema: null
sql: null
params: null
template_params: null
filter_select_enabled: true
fetch_values_predicate: null
extra: null
normalize_columns: false
always_filter_main_dttm: false
