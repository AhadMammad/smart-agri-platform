metrics:
  - metric_name: count
    verbose_name: Machine-days
    metric_type: count
    expression: COUNT(*)
    description: null
    d3format: ',d'
    currency: null
    extra: null
    warning_text: null
  - metric_name: operation_hours_total
    verbose_name: Operating hours
    metric_type: sum
    expression: SUM(operation_hours)
    description: null
    d3format: ',.1f'
    currency: null
    extra: null
    warning_text: null
  - metric_name: area_covered_total
    verbose_name: Area covered (ha)
    metric_type: sum
    expression: SUM(area_covered_ha)
    description: null
    d3format: ',.1f'
    currency: null
    extra: null
    warning_text: null
  - metric_name: fuel_used_total
    verbose_name: Fuel used (L)
    metric_type: sum
    expression: SUM(fuel_used_litres)
    description: null
    d3format: ',.0f'
    currency: null
    extra: null
    warning_text: null
  - metric_name: fuel_per_ha_metric
    verbose_name: Fuel per hectare (L/ha)
    metric_type: avg
    expression: SUM(fuel_used_litres) / NULLIF(SUM(area_covered_ha), 0)
    description: Ratio of the totals, not a mean of daily ratios — a day covering
      a tenth of a hectare must not weigh as much as one covering fifty
    d3format: ',.2f'
    currency: null
    extra: null
    warning_text: null
  - metric_name: avg_idle_ratio
    verbose_name: Idle ratio (%)
    metric_type: avg
    expression: AVG(idle_ratio_pct)
    description: Share of running time spent idle; null on days the engine never ran
    d3format: ',.1f'
    currency: null
    extra: null
    warning_text: null
  - metric_name: downtime_hours_total
    verbose_name: Downtime (h)
    metric_type: sum
    expression: SUM(downtime_hours)
    description: null
    d3format: ',.1f'
    currency: null
    extra: null
    warning_text: null
  - metric_name: repair_cost_total
    verbose_name: Repair cost (USD)
    metric_type: sum
    expression: SUM(repair_cost_usd)
    description: null
    d3format: ',.0f'
    currency: null
    extra: null
    warning_text: null
  - metric_name: critical_faults_total
    verbose_name: Critical faults
    metric_type: sum
    expression: SUM(critical_faults)
    description: null
    d3format: ',d'
    currency: null
    extra: null
    warning_text: null
