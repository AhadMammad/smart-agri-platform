# Fleet utilisation per machine, over its whole series.
#
# A ClickHouse view rather than a virtual dataset: the rollup and the fuel ratio
# are defined once in `clickhouse/ddl/views/040_domain_views.sql`, so a chart
# here and a query in SQL Lab cannot disagree about what "fuel per hectare"
# means.
