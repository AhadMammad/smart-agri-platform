metrics:
  - metric_name: count
    verbose_name: Plantings
    metric_type: count
    expression: COUNT(*)
    description: null
    d3format: ',d'
    currency: null
    extra: null
    warning_text: null
  - metric_name: area_total
    verbose_name: Area (ha)
    metric_type: sum
    expression: SUM(area_ha)
    description: null
    d3format: ',.1f'
    currency: null
    extra: null
    warning_text: null
  - metric_name: yield_total
    verbose_name: Yield (t)
    metric_type: sum
    expression: SUM(yield_tonnes)
    description: null
    d3format: ',.1f'
    currency: null
    extra: null
    warning_text: null
  - metric_name: yield_per_ha
    verbose_name: Yield (t/ha)
    metric_type: avg
    expression: SUM(yield_tonnes) / NULLIF(SUM(CASE WHEN yield_t_ha IS NULL THEN 0 ELSE area_ha END), 0)
    description: Area-weighted, and only over area that actually produced a yield —
      a mean of per-hectare figures would over-weight the small fields
    d3format: ',.2f'
    currency: null
    extra: null
    warning_text: null
  - metric_name: revenue_total
    verbose_name: Revenue (USD)
    metric_type: sum
    expression: SUM(revenue_usd)
    description: null
    d3format: ',.0f'
    currency: null
    extra: null
    warning_text: null
  - metric_name: cost_total
    verbose_name: Cost (USD)
    metric_type: sum
    expression: SUM(cost_total_usd)
    description: null
    d3format: ',.0f'
    currency: null
    extra: null
    warning_text: null
  - metric_name: gross_margin_total
    verbose_name: Gross margin (USD)
    metric_type: sum
    expression: SUM(gross_margin_usd)
    description: null
    d3format: ',.0f'
    currency: null
    extra: null
    warning_text: null
  - metric_name: margin_per_ha
    verbose_name: Margin per hectare (USD/ha)
    metric_type: avg
    expression: SUM(gross_margin_usd) / NULLIF(SUM(area_ha), 0)
    description: null
    d3format: ',.0f'
    currency: null
    extra: null
    warning_text: null
  - metric_name: water_received_avg
    verbose_name: Water received (mm)
    metric_type: avg
    expression: AVG(water_received_mm)
    description: Irrigation plus rainfall over the planting's own window
    d3format: ',.0f'
    currency: null
    extra: null
    warning_text: null
  - metric_name: water_use_efficiency
