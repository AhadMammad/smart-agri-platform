# One row per crop cycle: what it cost, what it returned, and on what water.
#
# Yield, revenue and margin are nullable while a planting is still in the
# ground. Superset omits nulls from aggregates, so a season in progress reads as
# "not yet harvested" rather than as a crop failure.
table_name: agg_planting_economics
main_dttm_col: planted_on
description: Cost, revenue, yield and water received for every planting
default_endpoint: null
offset: 0
cache_timeout: null
catalog: null
schema: null
sql: null
params: null
template_params: null
filter_select_enabled: true
fetch_values_predicate: null
extra: null
normalize_columns: false
always_filter_main_dttm: false
