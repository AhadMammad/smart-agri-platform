# Canopy development per field, with the crop actually in the ground.
#
# Physical table: the Gold mart has already joined the planting, variety and
# crop onto every row, so an NDVI reading arrives with the stage to judge it
# against and no chart needs a join.
table_name: agg_field_crop_health_daily
main_dttm_col: observed_on
description: Vegetation indices per field, in the context of the crop growing on it
default_endpoint: null
offset: 0
cache_timeout: null
catalog: null
schema: null
sql: null
params: null
template_params: null
filter_select_enabled: true
fetch_values_predicate: null
extra: null
normalize_columns: false
always_filter_main_dttm: false
uuid: 58716fc6-8f8d-5a01-bf11-1f456ce2e6d1
metrics:
  - metric_name: count
    verbose_name: Observations
    metric_type: count
    expression: COUNT(*)
    description: null
    d3format: ',d'
    currency: null
    extra: null
    warning_text: null
  - metric_name: avg_ndvi_metric
    verbose_name: Avg NDVI
    metric_type: avg
    expression: AVG(avg_ndvi)
    description: Mean vegetation index across the selected fields
    d3format: ',.3f'
    currency: null
    extra: null
    warning_text: null
  - metric_name: ndvi_vs_expected
    verbose_name: NDVI vs crop peak (%)
    metric_type: avg
    expression: AVG(ndvi_vs_expected_pct)
    description: Canopy as a percentage of what this crop reaches at full cover
    d3format: ',.0f'
    currency: null
    extra: null
    warning_text: null
  - metric_name: field_observations
    verbose_name: Fields observed
    metric_type: count_distinct
    expression: COUNT(DISTINCT field_id)
    description: null
    d3format: ',d'
    currency: null
    extra: null
    warning_text: null
  - metric_name: low_vigour_observations
    verbose_name: Low-vigour observations
    metric_type: sum
    expression: "SUM(CASE WHEN vigour_flag = 'low' THEN 1 ELSE 0 END)"
    description: Observations where the canopy is well below the crop's own peak
    d3format: ',d'
    currency: null
    extra: null
    warning_text: null
