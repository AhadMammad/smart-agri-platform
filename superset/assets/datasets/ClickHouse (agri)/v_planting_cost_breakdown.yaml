# Cost per planting, long rather than wide.
#
# `agg_planting_economics` holds one column per cost category, which is the
# right shape for a table and the wrong one for a stacked bar — a chart would
# have to name all eight. The view unpivots them with ARRAY JOIN so a category
# is a value to group by.
