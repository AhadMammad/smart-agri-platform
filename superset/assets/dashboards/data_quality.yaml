    meta:
      width: 12
      height: 30
      code: |-
        ## Data Quality

        The result of every check run by every pipeline and suite, from
        `ops_dq_check_result` — copied hourly from etl-meta-db by the `data_quality` DAG.

        A check's **severity** decides what a breach does: an *error* stops the run, so
        nothing downstream sees the data, while a *warning* is recorded here and the run
        carries on. A check without a threshold is a measurement and always passes, so
        its number has a history.

        Rows **dropped** are counted where they leave: orphans at a join, exclusions at a
        filter, duplicates at a dedupe. **Freshness** is hours since a pipeline last
        succeeded; a domain is stale after 26 hours.
    parents:
      - ROOT_ID
      - GRID_ID
      - ROW-header

