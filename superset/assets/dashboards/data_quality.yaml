# Data Quality — the Phase 9 results.
#
# Reads only the ops_* tables and the v_dq_* / v_pipeline_freshness views over
# them, all copied from etl-meta-db, never the business tables: this dashboard
# describes the platform's checks, not the farms. Layout follows the triage
# order — is it getting worse, what is failing now, where are rows going, and
# what has stopped running.
#
# UUIDs here and in the charts and datasets it uses are uuid5 under the
# namespace uuid5(NAMESPACE_DNS, 'smart-agri-platform.data-quality').
