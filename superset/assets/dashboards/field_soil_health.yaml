# Field & crop health — the Phase 2 dashboard.
#
# Layout is a single column of rows: the moisture trend on top (the question
# most often asked), the stress breakdown beside it, then the per-field table.
dashboard_title: Field & Crop Health
description: Soil moisture, temperature and stress by field, farm and region
css: ''
slug: field-soil-health
uuid: 714c8061-3ec0-568f-8fc7-bbb67859cd02
version: 1.0.0
certified_by: null
certification_details: null
published: true
position:
  DASHBOARD_VERSION_KEY: v2
  ROOT_ID:
    type: ROOT
    id: ROOT_ID
    children:
      - GRID_ID
  GRID_ID:
    type: GRID
    id: GRID_ID
    children:
      - ROW-header
      - ROW-trend
      - ROW-detail
      - ROW-canopy
      - ROW-canopy-detail
    parents:
      - ROOT_ID
  HEADER_ID:
    type: HEADER
    id: HEADER_ID
    meta:
      text: Field & Crop Health

  ROW-header:
    type: ROW
    id: ROW-header
    children:
      - MARKDOWN-intro
    meta:
      background: BACKGROUND_TRANSPARENT
    parents:
      - ROOT_ID
      - GRID_ID
  MARKDOWN-intro:
    type: MARKDOWN
    id: MARKDOWN-intro
    children: []
    meta:
      width: 12
      height: 22
      code: |-
        ## Field & Crop Health

        Daily soil metrics per field, from the `agg_field_soil_daily` table
        produced by the Gold pipeline. **Moisture stress** is derived from mean
        volumetric moisture: below 15% is *dry*, above 38% is *wet*.
    parents:
      - ROOT_ID
      - GRID_ID
      - ROW-header

  ROW-trend:
    type: ROW
    id: ROW-trend
    children:
      - CHART-moisture-trend
      - CHART-stress-breakdown
    meta:
      background: BACKGROUND_TRANSPARENT
    parents:
      - ROOT_ID
      - GRID_ID
  CHART-moisture-trend:
    type: CHART
    id: CHART-moisture-trend
    children: []
    meta:
      width: 8
      height: 60
      chartId: null
      uuid: e5d2a9bc-ad1c-5e5c-8b80-cdfdec46d443
      sliceName: Soil moisture trend by region
    parents:
      - ROOT_ID
      - GRID_ID
      - ROW-trend
  CHART-stress-breakdown:
    type: CHART
    id: CHART-stress-breakdown
    children: []
    meta:
      width: 4
      height: 60
      chartId: null
      uuid: 284a41b9-cd33-56ee-83ca-79a7a505c162
      sliceName: Field days by moisture stress
    parents:
      - ROOT_ID
      - GRID_ID
      - ROW-trend

  ROW-detail:
    type: ROW
    id: ROW-detail
    children:
      - CHART-field-conditions
      - CHART-temp-vs-moisture
    meta:
      background: BACKGROUND_TRANSPARENT
    parents:
      - ROOT_ID
      - GRID_ID
  CHART-field-conditions:
    type: CHART
    id: CHART-field-conditions
    children: []
    meta:
      width: 6
      height: 60
      chartId: null
      uuid: fba58a7d-ec4d-50ae-bb9c-eba39e80ccda
      sliceName: Current field conditions
    parents:
      - ROOT_ID
      - GRID_ID
      - ROW-detail
  CHART-temp-vs-moisture:
    type: CHART
    id: CHART-temp-vs-moisture
    children: []
    meta:
      width: 6
      height: 60
      chartId: null
      uuid: 281cf608-099b-593b-88f0-48c53f02b88b
      sliceName: Moisture vs temperature by soil type
    parents:
      - ROOT_ID
      - GRID_ID
      - ROW-detail

  # Phase 6 added the canopy side of "crop health". Soil above, canopy below:
  # the same field, measured from the ground and from orbit.
  ROW-canopy:
    type: ROW
    id: ROW-canopy
    children:
      - CHART-ndvi-trend
      - CHART-canopy-stage
    meta:
      background: BACKGROUND_TRANSPARENT
    parents:
      - ROOT_ID
      - GRID_ID
  CHART-ndvi-trend:
    type: CHART
    id: CHART-ndvi-trend
    children: []
    meta:
      width: 8
      height: 60
      chartId: null
      uuid: b22e1d2f-5d76-5996-8558-d31a6da689d2
      sliceName: NDVI trend by crop
    parents:
      - ROOT_ID
      - GRID_ID
      - ROW-canopy
  CHART-canopy-stage:
    type: CHART
    id: CHART-canopy-stage
    children: []
