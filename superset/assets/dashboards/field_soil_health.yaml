    meta:
      width: 12
      height: 60
      chartId: null
      uuid: 390c0b57-8c98-50fc-8649-f2df5bc5d6a9
      sliceName: Field canopy detail
    parents:
      - ROOT_ID
      - GRID_ID
      - ROW-canopy-detail

