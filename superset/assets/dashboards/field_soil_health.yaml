  refresh_frequency: 0
  expanded_slices: {}
  label_colors: {}
  timed_refresh_immune_slices: []
  cross_filters_enabled: true
  # Filters the dashboard opens with. Region and field are the two dimensions
  # an agronomist narrows by first.
  native_filter_configuration:
    - id: NATIVE_FILTER-region
      name: Region
      filterType: filter_select
      controlValues:
        enableEmptyFilter: false
        multiSelect: true
        searchAllOptions: false
        inverseSelection: false
      targets:
        - datasetUuid: 5da48fcf-262a-535f-9c69-cf82dcc22632
          column:
            name: region
      defaultDataMask:
        filterState: {}
        extraFormData: {}
      scope:
        rootPath:
          - ROOT_ID
        excluded: []
    - id: NATIVE_FILTER-field
      name: Field
      filterType: filter_select
      controlValues:
        enableEmptyFilter: false
        multiSelect: true
        searchAllOptions: false
        inverseSelection: false
      targets:
