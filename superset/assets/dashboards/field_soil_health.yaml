          column:
            name: field_name
      defaultDataMask:
        filterState: {}
        extraFormData: {}
      scope:
        rootPath:
          - ROOT_ID
        excluded: []
    - id: NATIVE_FILTER-soil
      name: Soil type
      filterType: filter_select
      controlValues:
        enableEmptyFilter: false
        multiSelect: true
        searchAllOptions: false
        inverseSelection: false
      targets:
