    meta:
      width: 12
      height: 24
      code: |-
        ## Machinery & Fleet

        Daily fleet activity from `agg_machine_daily`. Telemetry is the spine, so
        a machine that never started still has a row and parked time is visible.

        **Utilisation** is *working* when the engine ran and covered ground,
        *idle* when it ran without doing so, *parked* when it never ran, and
        *down* whenever a critical fault was open — which outranks all three,
        because a broken machine that happened to idle is still broken.
    parents:
      - ROOT_ID
      - GRID_ID
      - ROW-header

