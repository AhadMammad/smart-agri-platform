      name: Machine type
      filterType: filter_select
      controlValues:
        enableEmptyFilter: false
        multiSelect: true
        searchAllOptions: false
        inverseSelection: false
      targets:
        - datasetUuid: 7e62538c-19aa-585d-8812-ecb2e9f9cbb5
          column:
            name: machine_type
      defaultDataMask:
        filterState: {}
        extraFormData: {}
      scope:
        rootPath:
          - ROOT_ID
        excluded: []
    - id: NATIVE_FILTER-farm
