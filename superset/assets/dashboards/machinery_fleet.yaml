# Machinery & Fleet — the Phase 6 machine mart.
#
# Reads only `agg_machine_daily` and the `v_machine_utilisation` rollup over it,
# so every tile agrees on what a working day is. Layout follows the question
# order: what is the fleet doing, what does it cost to run, and which machine
# needs attention.
