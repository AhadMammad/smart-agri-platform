  ROW-intro:
    type: ROW
    id: ROW-intro
    children:
      - MARKDOWN-intro
    meta:
      background: BACKGROUND_TRANSPARENT
    parents:
      - ROOT_ID
      - GRID_ID
  MARKDOWN-intro:
    type: MARKDOWN
    id: MARKDOWN-intro
    children: []
    meta:
      width: 12
      height: 24
      code: |-
        ## Irrigation & Water

        Weather comes from **Open-Meteo**; soil moisture from the field probes.
        Only *measured* weather is shown — forecast rows are excluded, because
        correlating an observation against a prediction would partly reflect the
        forecast model rather than the field.

        **Water balance** is rainfall less reference evapotranspiration. A
        negative figure means the crop drew on stored soil water that day.
    parents:
      - ROOT_ID
      - GRID_ID
      - ROW-intro

