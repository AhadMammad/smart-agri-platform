# Irrigation & Water — the Phase 4 dashboard.
#
# Its top chart is the platform's exit criterion for weather ingestion: real
# rainfall from Open-Meteo against soil moisture measured by the field probes.
# If the pipeline is sound, moisture rises in the days after rain.
dashboard_title: Irrigation & Water
description: Rainfall, evapotranspiration and soil moisture per field
