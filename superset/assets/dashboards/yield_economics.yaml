    meta:
      width: 12
      height: 24
      code: |-
        ## Yield & Economics

        One row per planting, from `agg_planting_economics`. Cost is derived from
        what was actually consumed — inputs, irrigation energy and machine fuel —
        rather than drawn independently, so margin and yield are related
        quantities rather than three unconnected series.

        **Water received** is irrigation plus the rain that fell between sowing
        and harvest, counted over each planting's own window. **Water-use
        efficiency** is tonnes per hectare per 100 mm of that.
    parents:
