# Yield & Economics — the Phase 6 planting mart.
#
# One row per crop cycle, so the questions here close only when a cycle does.
# Yield, revenue and margin are null while a planting is still growing; Superset
# omits nulls from aggregates, so a season in progress reads as unfinished
# rather than as a crop failure.
