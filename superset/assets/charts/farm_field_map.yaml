# Every farm and field as a point, coloured by entity type.
#
# `mapbox_style` is an OSM tile URL, not a `mapbox://` style. Superset 6
# renders that through deck.gl's own TileLayer and only mounts mapbox-gl for
# a `mapbox://` style, so no Mapbox account or token is involved. On 4.1.1
# this rendered blank: mapbox-gl was always mounted, and its v2 billing check
# permanently blanks the canvas once the token 401s.
slice_name: Farm & field locations
description: Every farm and field as a point on the map, coloured by type
certified_by: null
certification_details: null
viz_type: deck_scatter
params:
  datasource: 7f99d676-5951-4cc4-9be1-c8adf8c962f2__table
  viz_type: deck_scatter
  time_range: No filter
  row_limit: 10000
  adhoc_filters: []
  spatial:
    type: latlong
    lonCol: longitude
    latCol: latitude
  dimension: entity_type
  color_scheme: supersetColors
  point_radius_fixed:
    type: fix
    value: 60000
  point_unit: square_m
  multiplier: 1
  # Pixel floor and ceiling on the drawn dot (deck.gl's radiusMinPixels /
  # radiusMaxPixels). Without the floor a point is drawn at its true ground
  # size — 60000 m² is a ~138 m radius, which is well under a pixel at the
  # continent zoom this map opens at, so all 25 render invisibly.
  min_radius: 6
  max_radius: 24
  filter_nulls: true
  mapbox_style: https://tile.openstreetmap.org/{z}/{x}/{y}.png
  viewport:
    longitude: 5
    latitude: 15
    zoom: 3.5
    bearing: 0
    pitch: 0
  legend_position: tr
  legend_format: null
  js_columns: []
  js_data_mutator: null
  js_tooltip: null
  js_onclick_href: null
query_context: null
cache_timeout: null
uuid: 470ef020-6731-48a9-909e-61337c669c7e
version: 1.0.0
dataset_uuid: 7f99d676-5951-4cc4-9be1-c8adf8c962f2
