# Every farm and field as a point, coloured by entity type.
#
# `mapbox_style` is an inline raster style pointing straight at OSM's tile
# servers, not a mapbox:// style or a hosted style.json URL. That style.json
# route (CARTO's Positron, still no Mapbox account needed) rendered a blank
# map in practice — everything server-side checked out (data, mapboxApiKey,
# form_data wiring), which points at the browser-side fetch chain for that
# style's glyphs/sprite/vector tiles as the break. A raster source needs none
# of that: just image tiles, no style.json fetch at all.
slice_name: Farm & field locations
description: Every farm and field as a point on the map, coloured by type
certified_by: null
certification_details: null
viz_type: deck_scatter
params:
  datasource: 7f99d676-5951-4cc4-9be1-c8adf8c962f2__table
  viz_type: deck_scatter
  time_range: No filter
  row_limit: 10000
  adhoc_filters: []
  spatial:
    type: latlong
    lonCol: longitude
    latCol: latitude
  dimension: entity_type
  color_scheme: supersetColors
  point_radius_fixed:
    type: fix
    value: 60000
  point_unit: square_m
  multiplier: 1
  min_radius: null
  max_radius: 100
  filter_nulls: true
  mapbox_style:
    version: 8
    sources:
      osm:
        type: raster
        tiles:
          - https://a.tile.openstreetmap.org/{z}/{x}/{y}.png
          - https://b.tile.openstreetmap.org/{z}/{x}/{y}.png
          - https://c.tile.openstreetmap.org/{z}/{x}/{y}.png
        tileSize: 256
        attribution: "© OpenStreetMap contributors"
    layers:
      - id: osm
        type: raster
        source: osm
  viewport:
    longitude: 5
    latitude: 15
    zoom: 3.5
    bearing: 0
    pitch: 0
  legend_position: tr
  legend_format: null
  js_columns: []
  js_data_mutator: null
  js_tooltip: null
  js_onclick_href: null
query_context: null
cache_timeout: null
